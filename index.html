<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Paul 🎮</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #gameWrapper {
      position: relative;
    }
    canvas {
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.4);
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      -webkit-pointer-events: auto;
    }
    .screen.active { display: flex; }
    .title {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 0 #f0a500, 0 0 20px rgba(255,200,0,0.5);
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 18px;
      color: #aef;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .btn {
      padding: 16px 40px;
      min-height: 54px;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #f0a500, #ff6b35);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c07000, 0 0 20px rgba(240,165,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c07000, 0 0 24px rgba(240,165,0,0.5); }
    .btn:active { transform: translateY(2px); box-shadow: 0 4px 0 #c07000; }
    .score-display {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .hint {
      font-size: 14px;
      color: #8cf;
      opacity: 0.8;
    }
    #scoreHud {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 3px 0 rgba(0,0,0,0.3), 0 0 10px rgba(255,255,255,0.2);
      pointer-events: none;
    }
    #imageUploadWrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #imageUploadWrapper label {
      font-size: 13px;
      color: #8cf;
      cursor: pointer;
      text-decoration: underline;
      pointer-events: all;
    }
    #imageUpload { display: none; }
  </style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="scoreHud"></div>
  <div id="ui">
    <div class="screen active" id="startScreen">
      <div class="title">Flappy Paul</div>
      <div class="subtitle">Kannst du durch die Rohre fliegen? 😄</div>
      <div id="imageUploadWrapper">
        <label for="imageUpload">📷 Eigenes Foto hochladen (optional)</label>
        <input type="file" id="imageUpload" accept="image/*" />
      </div>
      <button class="btn" id="startBtn">▶ Spielen</button>
      <div class="hint">LEERTASTE · Klick · Tippen</div>
    </div>
    <div class="screen" id="gameoverScreen">
      <div class="title">Game Over!</div>
      <div class="score-display" id="finalScore"></div>
      <div class="score-display" id="bestScore" style="font-size:18px;color:#fa0;"></div>
      <button class="btn" id="restartBtn">🔄 Nochmal</button>
      <div class="hint">oder LEERTASTE drücken</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive sizing
const BASE_W = 400, BASE_H = 600;
let scale = 1;

function resize() {
  const maxH = window.innerHeight * 0.92;
  const maxW = window.innerWidth * 0.96;
  scale = Math.min(maxW / BASE_W, maxH / BASE_H);
  canvas.width = BASE_W;
  canvas.height = BASE_H;
  canvas.style.width = (BASE_W * scale) + 'px';
  canvas.style.height = (BASE_H * scale) + 'px';
  document.getElementById('gameWrapper').style.width = (BASE_W * scale) + 'px';
  document.getElementById('gameWrapper').style.height = (BASE_H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ── Game State ──────────────────────────────────────────────────────────────
let state = 'start'; // start | playing | dead
let score = 0;
let best = parseInt(localStorage.getItem('fb_best') || '0');
let animFrame;

// ── Custom character image ──────────────────────────────────────────────────
let charImg = null;
document.getElementById('imageUpload').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { charImg = img; };
  img.src = url;
});

// ── Bird ────────────────────────────────────────────────────────────────────
const GRAVITY = 0.45;
const JUMP_VEL = -8.5;
const BIRD_W = 52, BIRD_H = 52;

let bird = { x: 90, y: BASE_H / 2, vy: 0, angle: 0, flap: 0, flapDir: 1 };

function resetBird() {
  bird.x = 90;
  bird.y = BASE_H / 2;
  bird.vy = 0;
  bird.angle = 0;
  bird.flap = 0;
}

function jump() {
  if (state === 'start') { startGame(); return; }
  if (state === 'dead') { restartGame(); return; }
  bird.vy = JUMP_VEL;
  bird.flap = 1;
}

// ── Pipes ────────────────────────────────────────────────────────────────────
const PIPE_W = 58;
const PIPE_GAP = 165;
const PIPE_SPEED_START = 2.5;
let pipeSpeed = PIPE_SPEED_START;
let pipes = [];
let pipeTimer = 0;
const PIPE_INTERVAL = 90; // frames

function spawnPipe() {
  const minY = 80, maxY = BASE_H - 80 - PIPE_GAP;
  const topH = Math.floor(Math.random() * (maxY - minY) + minY);
  pipes.push({ x: BASE_W + 10, topH, scored: false });
}

// ── Clouds (background) ──────────────────────────────────────────────────────
let clouds = [
  { x: 60,  y: 60,  w: 90, spd: 0.3 },
  { x: 220, y: 100, w: 70, spd: 0.2 },
  { x: 320, y: 45,  w: 110, spd: 0.25 },
];

// ── Ground ───────────────────────────────────────────────────────────────────
const GROUND_Y = BASE_H - 60;
let groundX = 0;

// ── Drawing helpers ──────────────────────────────────────────────────────────
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, '#1a8ce0');
  grad.addColorStop(1, '#80d4f7');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, GROUND_Y);
}

function drawClouds() {
  clouds.forEach(c => {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#fff';
    drawCloud(c.x, c.y, c.w);
    ctx.restore();
    if (state === 'playing') {
      c.x -= c.spd;
      if (c.x + c.w < -20) c.x = BASE_W + 20;
    }
  });
}

function drawCloud(x, y, w) {
  const h = w * 0.4;
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
  ctx.ellipse(x - w * 0.22, y + h * 0.1, w * 0.32, h * 0.42, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.22, y + h * 0.1, w * 0.32, h * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  // Dirt
  ctx.fillStyle = '#c8a05a';
  ctx.fillRect(0, GROUND_Y, BASE_W, BASE_H - GROUND_Y);
  // Grass strip
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(0, GROUND_Y, BASE_W, 16);
  // Moving grass lines
  ctx.strokeStyle = '#388e3c';
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const gx = ((groundX + i * 36) % BASE_W);
    ctx.beginPath(); ctx.moveTo(gx, GROUND_Y); ctx.lineTo(gx, GROUND_Y + 16); ctx.stroke();
  }
  if (state === 'playing') groundX = (groundX + pipeSpeed) % 36;
}

function drawPipe(p) {
  const capH = 22, capExtra = 6;

  // === TOP PIPE ===
  // body
  const tg = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  tg.addColorStop(0, '#2e7d32');
  tg.addColorStop(0.35, '#66bb6a');
  tg.addColorStop(0.7, '#388e3c');
  tg.addColorStop(1, '#1b5e20');
  ctx.fillStyle = tg;
  ctx.fillRect(p.x + capExtra, 0, PIPE_W - capExtra * 2, p.topH - capH);

  // top pipe cap
  ctx.fillStyle = '#43a047';
  roundRect(ctx, p.x, p.topH - capH, PIPE_W, capH, [0, 0, 8, 8]);
  ctx.fill();
  ctx.strokeStyle = '#1b5e20';
  ctx.lineWidth = 2;
  roundRect(ctx, p.x, p.topH - capH, PIPE_W, capH, [0, 0, 8, 8]);
  ctx.stroke();

  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(p.x + capExtra + 5, 0, 8, p.topH - capH);

  // === BOTTOM PIPE ===
  const botY = p.topH + PIPE_GAP;
  const botH = GROUND_Y - botY;

  const bg = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  bg.addColorStop(0, '#2e7d32');
  bg.addColorStop(0.35, '#66bb6a');
  bg.addColorStop(0.7, '#388e3c');
  bg.addColorStop(1, '#1b5e20');
  ctx.fillStyle = bg;
  ctx.fillRect(p.x + capExtra, botY + capH, PIPE_W - capExtra * 2, botH - capH);

  // bottom pipe cap
  ctx.fillStyle = '#43a047';
  roundRect(ctx, p.x, botY, PIPE_W, capH, [8, 8, 0, 0]);
  ctx.fill();
  ctx.strokeStyle = '#1b5e20';
  ctx.lineWidth = 2;
  roundRect(ctx, p.x, botY, PIPE_W, capH, [8, 8, 0, 0]);
  ctx.stroke();

  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(p.x + capExtra + 5, botY + capH, 8, botH - capH);
}

function roundRect(ctx, x, y, w, h, r) {
  const [tl, tr, br, bl] = Array.isArray(r) ? r : [r,r,r,r];
  ctx.beginPath();
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + tr);
  ctx.lineTo(x + w, y + h - br);
  ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
  ctx.lineTo(x + bl, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - bl);
  ctx.lineTo(x, y + tl);
  ctx.quadraticCurveTo(x, y, x + tl, y);
  ctx.closePath();
}

// ── Draw the character (custom portrait) ─────────────────────────────────────
function drawCharacter(x, y, angle, flap) {
  ctx.save();
  ctx.translate(x + BIRD_W / 2, y + BIRD_H / 2);
  ctx.rotate(angle);

  const hw = BIRD_W / 2, hh = BIRD_H / 2;

  if (charImg) {
    // Use uploaded photo - circular crop
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, hw - 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(charImg, -hw, -hh, BIRD_W, BIRD_H);
    ctx.restore();
    // white border
    ctx.beginPath();
    ctx.arc(0, 0, hw - 1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 3;
    ctx.stroke();
  } else {
    drawPaulCharacter(hw, hh, flap);
  }

  ctx.restore();
}

function drawPaulCharacter(hw, hh, flap) {
  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, hh + 4, hw * 0.7, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Body / T-Shirt (black) ──
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(0, hh * 0.6, hw * 0.72, hh * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // collar
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(0, hh * 0.05, hw * 0.25, hh * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Head (skin tone) ──
  ctx.fillStyle = '#f5c5a3';
  ctx.beginPath();
  ctx.ellipse(0, -hh * 0.3, hw * 0.52, hh * 0.52, 0, 0, Math.PI * 2);
  ctx.fill();

  // face shading
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.beginPath();
  ctx.ellipse(0, -hh * 0.1, hw * 0.52, hh * 0.26, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Eyes ──
  const eyeY = -hh * 0.38;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-hw * 0.19, eyeY, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hw * 0.19, eyeY, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a2010';
  ctx.beginPath(); ctx.ellipse(-hw * 0.19, eyeY, 3.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hw * 0.19, eyeY, 3.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  // eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-hw * 0.21, eyeY - 1.5, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw * 0.17, eyeY - 1.5, 1.2, 0, Math.PI * 2); ctx.fill();

  // ── Glasses ──
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  // left lens
  ctx.beginPath();
  ctx.roundRect(-hw * 0.38, eyeY - 7, 17, 13, 3);
  ctx.stroke();
  // right lens
  ctx.beginPath();
  ctx.roundRect(hw * 0.07, eyeY - 7, 17, 13, 3);
  ctx.stroke();
  // bridge
  ctx.beginPath();
  ctx.moveTo(-hw * 0.38 + 17, eyeY);
  ctx.lineTo(hw * 0.07, eyeY);
  ctx.stroke();
  // left arm
  ctx.beginPath();
  ctx.moveTo(-hw * 0.38, eyeY);
  ctx.lineTo(-hw * 0.55, eyeY - 2);
  ctx.stroke();
  // right arm
  ctx.beginPath();
  ctx.moveTo(hw * 0.07 + 17, eyeY);
  ctx.lineTo(hw * 0.56, eyeY - 2);
  ctx.stroke();

  // ── Nose ──
  ctx.fillStyle = '#e8a882';
  ctx.beginPath();
  ctx.ellipse(0, -hh * 0.22, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Mouth (slight open / expression) ──
  ctx.fillStyle = '#c0705a';
  ctx.beginPath();
  ctx.ellipse(0, -hh * 0.08, 7, 4, 0, 0, Math.PI);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(0, -hh * 0.07, 5, 2.5, 0, 0, Math.PI);
  ctx.fill();

  // ── Ears ──
  ctx.fillStyle = '#f5c5a3';
  ctx.beginPath(); ctx.ellipse(-hw * 0.5, -hh * 0.28, 5, 7, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hw * 0.5, -hh * 0.28, 5, 7, -0.2, 0, Math.PI * 2); ctx.fill();

  // ── Backwards cap ──
  const capY = -hh * 0.76;
  // cap body (dark navy)
  ctx.fillStyle = '#1e2a4a';
  ctx.beginPath();
  ctx.ellipse(0, -hh * 0.56, hw * 0.54, hh * 0.28, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  // cap top
  ctx.fillStyle = '#243060';
  ctx.beginPath();
  ctx.ellipse(0, -hh * 0.7, hw * 0.52, hh * 0.22, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  // brim (pointing BACK - left side since character faces right)
  ctx.fillStyle = '#1e2a4a';
  ctx.beginPath();
  ctx.ellipse(-hw * 0.5, -hh * 0.56, 14, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // button on top
  ctx.fillStyle = '#3a4a80';
  ctx.beginPath();
  ctx.arc(0, -hh * 0.88, 3, 0, Math.PI * 2);
  ctx.fill();
  // stripe on cap
  ctx.strokeStyle = '#3a4a80';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-hw * 0.3, -hh * 0.62);
  ctx.lineTo(hw * 0.3, -hh * 0.62);
  ctx.stroke();

  // ── Arms flap animation ──
  const flapOffset = Math.sin(Date.now() * 0.008) * 8;
  ctx.fillStyle = '#f5c5a3';
  // left arm
  ctx.save();
  ctx.translate(-hw * 0.7, hh * 0.1);
  ctx.rotate(0.4 + flapOffset * 0.05);
  ctx.beginPath();
  ctx.ellipse(0, 0, 7, 14, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // right arm
  ctx.save();
  ctx.translate(hw * 0.7, hh * 0.1);
  ctx.rotate(-0.4 - flapOffset * 0.05);
  ctx.beginPath();
  ctx.ellipse(0, 0, 7, 14, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Score HUD ────────────────────────────────────────────────────────────────
function updateHud() {
  const hud = document.getElementById('scoreHud');
  hud.textContent = state === 'playing' ? score : '';
}

// ── Collision ────────────────────────────────────────────────────────────────
function checkCollision() {
  const bx = bird.x + 6, by = bird.y + 6;
  const bw = BIRD_W - 12, bh = BIRD_H - 12;

  if (by + bh >= GROUND_Y) return true;
  if (by <= 0) return true;

  for (const p of pipes) {
    const withinX = bx + bw > p.x + 4 && bx < p.x + PIPE_W - 4;
    const hitTop = by < p.topH;
    const hitBot = by + bh > p.topH + PIPE_GAP;
    if (withinX && (hitTop || hitBot)) return true;
  }
  return false;
}

// ── Game loop ─────────────────────────────────────────────────────────────────
let frame = 0;
function loop() {
  animFrame = requestAnimationFrame(loop);
  frame++;

  // ── Update ──
  if (state === 'playing') {
    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.angle = Math.max(-0.4, Math.min(1.2, bird.vy * 0.06));
    bird.flap = Math.max(0, bird.flap - 0.1);

    // Pipes
    pipeTimer++;
    if (pipeTimer >= PIPE_INTERVAL) { spawnPipe(); pipeTimer = 0; }

    for (let i = pipes.length - 1; i >= 0; i--) {
      pipes[i].x -= pipeSpeed;
      if (!pipes[i].scored && pipes[i].x + PIPE_W < bird.x) {
        pipes[i].scored = true;
        score++;
        pipeSpeed = PIPE_SPEED_START + Math.floor(score / 5) * 0.3;
        showScorePop();
      }
      if (pipes[i].x + PIPE_W < -10) pipes.splice(i, 1);
    }

    if (checkCollision()) {
      state = 'dead';
      if (score > best) { best = score; localStorage.setItem('fb_best', best); }
      document.getElementById('finalScore').textContent = '🏆 Punkte: ' + score;
      document.getElementById('bestScore').textContent = 'Bestleistung: ' + best;
      document.getElementById('gameoverScreen').classList.add('active');
      document.getElementById('scoreHud').textContent = '';
    }
  } else if (state === 'start') {
    // idle bob
    bird.y = BASE_H / 2 - 20 + Math.sin(Date.now() * 0.003) * 12;
  }

  // ── Draw ──
  drawSky();
  drawClouds();
  pipes.forEach(drawPipe);
  drawGround();
  drawCharacter(bird.x, bird.y, bird.angle, bird.flap);
  updateHud();
}

// ── Score pop animation ───────────────────────────────────────────────────────
let pops = [];
function showScorePop() {
  pops.push({ x: bird.x + 30, y: bird.y, alpha: 1 });
  setTimeout(() => { pops.shift(); }, 600);
}

// overlay pops each frame (called in rAF)
const origLoop = loop;
// (pops drawn inline in loop below)

// ── Game control ──────────────────────────────────────────────────────────────
function startGame() {
  state = 'playing';
  score = 0;
  pipes = [];
  pipeTimer = 0;
  pipeSpeed = PIPE_SPEED_START;
  resetBird();
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameoverScreen').classList.remove('active');
}

function restartGame() {
  document.getElementById('gameoverScreen').classList.remove('active');
  startGame();
}

function addBtn(id) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => { e.stopPropagation(); jump(); });
  el.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); jump(); }, { passive: false });
}
addBtn('startBtn');
addBtn('restartBtn');

canvas.addEventListener('click', () => jump());
document.getElementById('gameWrapper').addEventListener('touchstart', e => {
  if (e.target.closest('.btn') || e.target.closest('label') || e.target.id === 'imageUpload') return;
  e.preventDefault();
  jump();
}, { passive: false });
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); } });

// Start the loop
requestAnimationFrame(loop);
</script>
</body>
</html>
